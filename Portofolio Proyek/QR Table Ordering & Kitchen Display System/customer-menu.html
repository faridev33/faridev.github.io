<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Pelanggan - Cafe Fari QR Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #1e1e1e;">

  <script src="js/store.js"></script>
  <script src="js/navbar.js"></script>

  <div class="customer-viewport">
    <div class="mobile-wrapper">
      
      <!-- Customer Sticky Header -->
      <header class="customer-header">
        <div class="brand-wrap">
          <span style="font-size:22px;">☕</span>
          <h1 class="cafe-title">Cafe Fari</h1>
        </div>
        <div class="table-info" id="tableBadgeDisplay">
          Meja 01
        </div>
      </header>

      <!-- Welcome Banner -->
      <div class="customer-hero">
        <div class="welcome-banner">
          <h2>Selamat Datang & Nikmati</h2>
          <p>Pilih menu favorit Anda langsung dari meja tanpa perlu antre di kasir.</p>
        </div>
      </div>

      <!-- Search Input -->
      <div class="search-bar-wrap">
        <input 
          type="text" 
          id="menuSearchInput" 
          class="search-input" 
          placeholder="🔍 Cari kopi, makanan, cemilan..." 
        />
      </div>

      <!-- Category Filter Tabs -->
      <div class="category-bar">
        <button class="cat-pill active" data-cat="all">Semua Menu</button>
        <button class="cat-pill" data-cat="Makanan">Makanan</button>
        <button class="cat-pill" data-cat="Minuman">Minuman & Kopi</button>
        <button class="cat-pill" data-cat="Dessert">Dessert</button>
        <button class="cat-pill" data-cat="Snack">Snack & Camilan</button>
      </div>

      <!-- Product Grid List -->
      <div class="customer-menu-grid" id="productGridContainer">
        <!-- Generated by JavaScript -->
      </div>

      <!-- Floating Cart Bottom Bar (Visible if cart has items) -->
      <div class="floating-cart-bar" id="floatingCartBar" style="display: none;">
        <div class="cart-bar-left">
          <div class="cart-qty-pill" id="cartCountBadge">0</div>
          <div>
            <div style="font-size: 11px; opacity: 0.85;">Total Pesanan</div>
            <div class="cart-bar-price" id="cartTotalPrice">Rp 0</div>
          </div>
        </div>
        <div class="cart-bar-action" id="btnGoToOrder">
          <span>Lihat Keranjang</span>
          <span>➔</span>
        </div>
      </div>

    </div>
  </div>

  <!-- PRODUCT OPTIONS MODAL -->
  <div class="modal-overlay" id="productOptionModal">
    <div class="modal-box" style="max-width: 440px;">
      <div class="modal-header">
        <h3 id="modalProductName">Nama Produk</h3>
        <button class="btn-close-modal" id="btnCloseOptionModal">&times;</button>
      </div>

      <div style="text-align: center; margin-bottom: 15px;">
        <img id="modalProductImg" src="" alt="" style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px;" />
      </div>

      <div style="margin-bottom: 15px;">
        <div id="modalProductPrice" style="font-size: 18px; font-weight: 700; color: var(--color-dark-coffee);">Rp 0</div>
        <p id="modalProductDesc" style="font-size: 12px; color: #666; margin: 4px 0 0 0; line-height: 1.4;"></p>
      </div>

      <!-- Dynamic Options Container -->
      <div id="modalDynamicOptions" style="margin-bottom: 15px;">
        <!-- Injected options -->
      </div>

      <!-- Catatan Khusus -->
      <div class="form-group" style="margin-bottom: 15px;">
        <label style="font-size: 12px; font-weight: 600;">Catatan Khusus (Opsional):</label>
        <textarea id="modalProductNote" class="form-input" rows="2" placeholder="Cth: Sambal dipisah, less ice, dll." style="font-size: 12px;"></textarea>
      </div>

      <!-- Quantity Selector & Add Button -->
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 15px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <button type="button" class="btn-qty" id="btnModalQtyMinus">-</button>
          <span id="modalQtyDisplay" style="font-weight: 700; font-size: 15px; min-width: 20px; text-align: center;">1</span>
          <button type="button" class="btn-qty" id="btnModalQtyPlus">+</button>
        </div>
        <button type="button" class="btn-add" id="btnAddToCartSubmit" style="padding: 10px 18px;">
          ➕ Tambahkan (<span id="modalSubtotalPrice">Rp 0</span>)
        </button>
      </div>

    </div>
  </div>

  <script>
    // Get table from query param or default to 1
    const urlParams = new URLSearchParams(window.location.search);
    const tableId = urlParams.get('table') || '1';
    document.getElementById('tableBadgeDisplay').textContent = 'Meja ' + (tableId.padStart(2, '0'));

    let currentProducts = [];
    let currentCategory = 'all';
    let searchQuery = '';
    let selectedProduct = null;
    let currentQty = 1;

    // Load and Render Products
    function renderProducts() {
      currentProducts = window.CafeStore.getProducts();
      const grid = document.getElementById('productGridContainer');
      grid.innerHTML = '';

      const filtered = currentProducts.filter(p => {
        const matchCat = (currentCategory === 'all' || p.category === currentCategory);
        const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                            p.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="text-align:center; padding: 40px 10px; color:#888;">
            <div style="font-size:36px; margin-bottom:10px;">🔍</div>
            <p>Menu tidak ditemukan untuk kategori atau kata kunci tersebut.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(p => {
        const isOutOfStock = p.status === 'Out of Stock';
        const card = document.createElement('div');
        card.className = `customer-product-card ${isOutOfStock ? 'out-of-stock' : ''}`;
        card.innerHTML = `
          <div class="card-img-wrap">
            <img src="${p.image}" alt="${p.name}" loading="lazy" />
            ${p.badge ? `<span class="card-badge">${p.badge}</span>` : ''}
          </div>
          <div class="card-info">
            <div>
              <h3>${p.name}</h3>
              <p class="card-desc">${p.desc}</p>
            </div>
            <div class="card-bottom">
              <span class="card-price">${window.CafeStore.formatRupiah(p.price)}</span>
              ${isOutOfStock 
                ? `<span style="font-size:11px; color:#c0392b; font-weight:700;">Habis</span>` 
                : `<button class="btn-card-add" data-id="${p.id}">+ Tambah</button>`
              }
            </div>
          </div>
        `;

        if (!isOutOfStock) {
          card.addEventListener('click', (e) => {
            openProductModal(p);
          });
        }

        grid.appendChild(card);
      });
    }

    // Modal Operations
    function openProductModal(prod) {
      selectedProduct = prod;
      currentQty = 1;
      document.getElementById('modalProductName').textContent = prod.name;
      document.getElementById('modalProductImg').src = prod.image;
      document.getElementById('modalProductPrice').textContent = window.CafeStore.formatRupiah(prod.price);
      document.getElementById('modalProductDesc').textContent = prod.desc;
      document.getElementById('modalProductNote').value = '';
      document.getElementById('modalQtyDisplay').textContent = '1';

      // Options
      const optionsBox = document.getElementById('modalDynamicOptions');
      optionsBox.innerHTML = '';

      if (prod.options && prod.options.length > 0) {
        prod.options.forEach((opt, idx) => {
          const wrap = document.createElement('div');
          wrap.style.marginBottom = '10px';
          wrap.innerHTML = `
            <div style="font-size:12px; font-weight:600; margin-bottom:4px; color:#333;">${opt.name}:</div>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              ${opt.choices.map((c, cIdx) => `
                <label style="font-size:11.5px; border:1px solid #ccc; padding:4px 10px; border-radius:20px; cursor:pointer; background:#fff; display:inline-flex; align-items:center; gap:4px;">
                  <input type="radio" name="opt_${idx}" value="${c}" ${cIdx === 0 ? 'checked' : ''} style="margin:0;">
                  ${c}
                </label>
              `).join('')}
            </div>
          `;
          optionsBox.appendChild(wrap);
        });
      }

      updateModalSubtotal();
      document.getElementById('productOptionModal').classList.add('active');
    }

    function updateModalSubtotal() {
      if (!selectedProduct) return;
      const subtotal = selectedProduct.price * currentQty;
      document.getElementById('modalSubtotalPrice').textContent = window.CafeStore.formatRupiah(subtotal);
      document.getElementById('modalQtyDisplay').textContent = currentQty;
    }

    document.getElementById('btnModalQtyMinus').addEventListener('click', () => {
      if (currentQty > 1) {
        currentQty--;
        updateModalSubtotal();
      }
    });

    document.getElementById('btnModalQtyPlus').addEventListener('click', () => {
      currentQty++;
      updateModalSubtotal();
    });

    document.getElementById('btnCloseOptionModal').addEventListener('click', () => {
      document.getElementById('productOptionModal').classList.remove('active');
    });

    // Add to Cart
    document.getElementById('btnAddToCartSubmit').addEventListener('click', () => {
      if (!selectedProduct) return;

      // Collect chosen options
      const selectedChoices = [];
      const optionInputs = document.querySelectorAll('#modalDynamicOptions input[type="radio"]:checked');
      optionInputs.forEach(inp => selectedChoices.push(inp.value));
      const optionsText = selectedChoices.join(' | ');

      const note = document.getElementById('modalProductNote').value.trim();

      const cart = window.CafeStore.getCart(tableId);
      const cartItemId = selectedProduct.id + '_' + optionsText + '_' + note;

      const existingIndex = cart.findIndex(item => item.cartItemId === cartItemId);
      if (existingIndex !== -1) {
        cart[existingIndex].quantity += currentQty;
      } else {
        cart.push({
          cartItemId: cartItemId,
          id: selectedProduct.id,
          name: selectedProduct.name,
          price: selectedProduct.price,
          quantity: currentQty,
          optionsText: optionsText,
          note: note
        });
      }

      window.CafeStore.saveCart(tableId, cart);
      document.getElementById('productOptionModal').classList.remove('active');
      renderFloatingCart();
    });

    // Floating Cart Update
    function renderFloatingCart() {
      const cart = window.CafeStore.getCart(tableId);
      const bar = document.getElementById('floatingCartBar');

      if (!cart || cart.length === 0) {
        bar.style.display = 'none';
        return;
      }

      const totalItems = cart.reduce((acc, item) => acc + item.quantity, 0);
      const grandTotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

      document.getElementById('cartCountBadge').textContent = totalItems;
      document.getElementById('cartTotalPrice').textContent = window.CafeStore.formatRupiah(grandTotal);
      bar.style.display = 'flex';
    }

    document.getElementById('floatingCartBar').addEventListener('click', () => {
      window.location.href = `customer-order.html?table=${tableId}`;
    });

    // Filter events
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.cat;
        renderProducts();
      });
    });

    document.getElementById('menuSearchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      renderProducts();
    });

    // Listen to changes in stock from kitchen
    window.addEventListener('cafefari:update', (e) => {
      if (e.detail && e.detail.topic === 'products') {
        renderProducts();
      }
    });

    // Initialize
    renderProducts();
    renderFloatingCart();
  </script>
</body>
</html>
